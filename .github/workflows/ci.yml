name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push on the same branch makes the previous run useless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the pipeline only reads the repository.
permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # Linux is the reference; Windows is the development platform and catches path and line-ending bugs.
      fail-fast: false
      matrix:
        # Pinned images keep the CI reproducible; bump them deliberately (`ubuntu-latest` moves to Ubuntu 26).
        os: [ubuntu-24.04, windows-2025]
    env:
      # Corepack would otherwise wait for a confirmation before downloading pnpm.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      # Actions are pinned by commit SHA (supply-chain policy, ADR 0013). The comment gives the tag.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # pnpm is not installed by a third-party action: Corepack reads `packageManager` in package.json.
      - name: Enable pnpm through Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage
